org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation fails when the project (D:) and the pub cache
# (C:) live on different drives: the relocatable-cache path conversion throws
# "this and base files have different roots", so :<plugin>:compileDebugKotlin
# fails to close its caches. Disabling incremental compilation makes the build
# correct at the cost of a little speed.
kotlin.incremental=false
kotlin.incremental.android=false
