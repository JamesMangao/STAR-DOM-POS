name: stardom_pos
description: "STAR:DOM POS — offline-first single-owner booth POS (Flutter web PWA)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  supabase_flutter: ^2.8.0
  # Pinned family: the web worker in web/drift_worker.js is compiled from THIS
  # drift version (web/drift_worker.dart → dart compile js), so the worker and
  # the drift code in the bundle can never drift apart.
  drift: ^2.25.0
  material_symbols_icons: ^4.2960.0
  uuid: ^4.5.1
  intl: ^0.20.2

  # W5 receipt printing: a PDF page 80 mm wide, shared through the iPad's
  # share/AirPrint sheet by the `printing` package (no Bluetooth, no APK).
  pdf: ^3.11.1
  printing: ^5.13.4

  # W2/W3 guarded browser APIs (navigator.storage, WakeLock, Blob download).
  web: ^1.1.0

  # Only for the portable network-error shape (`ClientException`), which is
  # what the browser fetch layer raises; dart:io must not appear in lib/ (W2).
  http: ^1.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.0
  build_runner: ^2.4.0
  sqlite3: ^3.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    # The shop's shelf: the catalogue (products, categories, bundle deals)
    # and the artwork, so a booth with no signal still shows the real shop.
    - assets/catalogue/
    - assets/catalogue/images/
    # Brand logo used in the app bar and splash.
    - assets/stardom-logo.webp
    # The PNG copy of the same logo, embedded into the receipt PDF (the PDF
    # library accepts PNG/JPEG only, not the webp above).
    - assets/android-chrome-512x512.png
    # The collab partner mark, in every brand lockup (sell header, sign-in,
    # splash and receipt).
    - assets/ka1ofakind.png

  fonts:
    # Bundled, never fetched at runtime (W3): no google_fonts, no CDN.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
