<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from. The path
    must start and end with a slash "/". `--base-href` replaces it at build
    time; Cloudflare Pages serves this app from the root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- DEVICE RULE (iPad 9th gen, standalone PWA):
       viewport-fit=cover + user-scalable=no. `viewport-fit=cover` lets the app
       paint under the home-indicator area (the safe-area insets are then
       respected in Dart); user-scalable=no stops the OS pinch-zoom that would
       otherwise leave the booth UI stuck at 2x. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Add to Home Screen: runs standalone (no URL bar, no browser back). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stardom">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- A booth tool is not a search result. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="STAR:DOM POS — offline-first booth point of sale.">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Stardom POS</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFF8F5;
      /* No rubber-band scrolling of the whole page behind the Flutter view. */
      overscroll-behavior: none;
      /* No long-press callout / text selection on a touch-only booth UI. */
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* iOS safe areas: the Flutter view already reports the insets, so the
       document itself must not add a second offset. */
    body { position: fixed; inset: 0; overflow: hidden; }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #B70011;
    }
  </style>
</head>
<body>
  <div id="loading">Starting STAR:DOM POS…</div>

  <!-- CanvasKit and every other engine asset are served from THIS origin (the
       build uses --no-web-resources-cdn), so the app boots with no network. -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Our own app-shell cache (web/sw.js). Flutter's generated worker is a
    // self-unregistering stub and is removed at build time, so this is the
    // only registration in the app. Guarded: a browser without service
    // workers still runs the POS, just without the offline shell.
    if ('serviceWorker' in navigator) {
      const initSW = async function () {
        try {
          const reg = await navigator.serviceWorker.register('sw.js');
          const notify = () => {
            if (reg.waiting && navigator.serviceWorker.controller) {
              window.dispatchEvent(new Event('stardom-update-ready'));
            }
          };
          reg.addEventListener('updatefound', () => {
            const w = reg.installing;
            if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') notify(); });
          });
          notify();
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
          setInterval(() => reg.update().catch(() => {}), 3600000);
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (window.__applyingUpdate) location.reload();
          });
          window.stardomApplyUpdate = async () => {
            window.__applyingUpdate = true;
            const r = await navigator.serviceWorker.getRegistration();
            if (r && r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
          };
        } catch (e) {
          console.warn('service worker registration failed:', e);
        }
      };
      if (document.readyState === 'complete') {
        initSW();
      } else {
        window.addEventListener('load', initSW);
      }
    }
  </script>
</body>
</html>
