<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from. The path
    must start and end with a slash "/". `--base-href` replaces it at build
    time; Cloudflare Pages serves this app from the root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- DEVICE RULE (iPad 9th gen, standalone PWA):
       viewport-fit=cover + user-scalable=no. `viewport-fit=cover` lets the app
       paint under the home-indicator area (the safe-area insets are then
       respected in Dart); user-scalable=no stops the OS pinch-zoom that would
       otherwise leave the booth UI stuck at 2x. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Add to Home Screen: runs standalone (no URL bar, no browser back). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stardom">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- A booth tool is not a search result. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="STAR:DOM POS — offline-first booth point of sale.">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Stardom POS</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFF8F5;
      /* No rubber-band scrolling of the whole page behind the Flutter view. */
      overscroll-behavior: none;
      /* No long-press callout / text selection on a touch-only booth UI. */
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    /* iOS safe areas: the Flutter view already reports the insets, so the
       document itself must not add a second offset. */
    body { position: fixed; inset: 0; overflow: hidden; }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 38%, #FFF2ED 0%, #FFF8F5 70%);
      z-index: 9999;
      user-select: none;
      padding: 24px;
      box-sizing: border-box;
      transition: opacity 0.4s ease-out;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: 100%;
      padding: 42px 28px 30px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 48px -10px rgba(183, 0, 17, 0.12),
                  0 4px 16px -2px rgba(0, 0, 0, 0.04),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(183, 0, 17, 0.08);
      animation: cardAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      top: -30px;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.28) 0%, rgba(183, 0, 17, 0.16) 50%, transparent 70%);
      filter: blur(24px);
      pointer-events: none;
      animation: orbPulse 4s ease-in-out infinite alternate;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-halo {
      position: absolute;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(183, 0, 17, 0.18) 0%, rgba(245, 158, 11, 0.08) 60%, transparent 80%);
      animation: haloBreath 3s ease-in-out infinite;
    }

    .splash-logo {
      height: 72px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(183, 0, 17, 0.18));
      animation: logoFloat 3.2s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    /* Both collab marks side by side: ST⭐️R:Dom × ka1ofakind. */
    .logo-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    .logo-lockup .splash-logo--partner {
      height: 58px;
      max-width: 150px;
      animation-delay: 0.6s;
    }

    .logo-x {
      font-size: 20px;
      font-weight: 700;
      color: #737373;
      animation: logoFloat 3.2s ease-in-out infinite;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 20px;
      background: #FFF4F0;
      border: 1px solid rgba(183, 0, 17, 0.18);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #B70011;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
      animation: blinkDot 1.6s infinite ease-in-out;
    }

    .title {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #1A1A1A;
      margin: 0 0 6px 0;
      text-align: center;
    }

    .subtitle {
      font-size: 13.5px;
      font-weight: 500;
      color: #737373;
      margin: 0 0 24px 0;
      text-align: center;
      line-height: 1.4;
    }

    .progress-bar-track {
      width: 100%;
      height: 6px;
      background: #F1ECE9;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      border-radius: 8px;
      background: linear-gradient(90deg, #F59E0B 0%, #B70011 50%, #EF4444 100%);
      box-shadow: 0 0 10px rgba(183, 0, 17, 0.35);
      animation: indeterminateShimmer 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      font-weight: 600;
      color: #9E9E9E;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(-0.5deg);
      }
    }

    @keyframes haloBreath {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.18);
        opacity: 1;
      }
    }

    @keyframes orbPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.35); opacity: 0.9; }
    }

    @keyframes indeterminateShimmer {
      0% {
        left: -45%;
        width: 30%;
      }
      50% {
        width: 55%;
      }
      100% {
        left: 105%;
        width: 30%;
      }
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="splash-card">
      <div class="glow-orb"></div>
      <div class="logo-wrapper">
        <div class="logo-halo"></div>
        <div class="logo-lockup">
          <img class="splash-logo" src="stardom-logo.webp" alt="ST⭐️R:Dom" onerror="this.style.display='none'">
          <span class="logo-x">×</span>
          <img class="splash-logo splash-logo--partner" src="ka1ofakind.png" alt="ka1ofakind" onerror="this.previousElementSibling.remove();this.remove()">
        </div>
      </div>
      <div class="badge-pill">
        <span class="badge-dot"></span>
        <span>Terminal · Offline Ready</span>
      </div>
      <h1 class="title">ST⭐️R:Dom × ka1ofakind</h1>
      <p class="subtitle">Starting booth point of sale…</p>
      <div class="progress-bar-track">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="footer-note">
        <span>⚡</span>
        <span>Offline-First Convention & Booth Engine</span>
      </div>
    </div>
  </div>

  <script>
    // Smoothly dismiss the HTML splash once Flutter paints the first frame
    function dismissSplash() {
      var loader = document.getElementById('loading');
      if (loader && !loader.dataset.dismissed) {
        loader.dataset.dismissed = 'true';
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 450);
      }
    }

    window.addEventListener('flutter-first-frame', dismissSplash);

    // Observer fallback: detects when Flutter mounts flutter-view or canvas
    var splashObserver = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        setTimeout(dismissSplash, 100);
        splashObserver.disconnect();
      }
    });
    splashObserver.observe(document.body, { childList: true, subtree: true });

    // Safety timeout fallback (in case first frame takes longer or debug reload)
    setTimeout(dismissSplash, 4000);
  </script>

  <!-- CanvasKit and every other engine asset are served from THIS origin (the
       build uses --no-web-resources-cdn), so the app boots with no network. -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Our own app-shell cache (web/sw.js). Flutter's generated worker is a
    // self-unregistering stub and is removed at build time, so this is the
    // only registration in the app. Guarded: a browser without service
    // workers still runs the POS, just without the offline shell.
    if ('serviceWorker' in navigator) {
      const initSW = async function () {
        try {
          const reg = await navigator.serviceWorker.register('sw.js');
          const notify = () => {
            if (reg.waiting && navigator.serviceWorker.controller) {
              window.dispatchEvent(new Event('stardom-update-ready'));
            }
          };
          reg.addEventListener('updatefound', () => {
            const w = reg.installing;
            if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') notify(); });
          });
          notify();
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
          setInterval(() => reg.update().catch(() => {}), 3600000);
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (window.__applyingUpdate) location.reload();
          });
          window.stardomApplyUpdate = async () => {
            window.__applyingUpdate = true;
            const r = await navigator.serviceWorker.getRegistration();
            if (r && r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
            location.reload();
          };
        } catch (e) {
          console.warn('service worker registration failed:', e);
        }
      };
      if (document.readyState === 'complete') {
        initSW();
      } else {
        window.addEventListener('load', initSW);
      }
    }
  </script>
</body>
</html>
